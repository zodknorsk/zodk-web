<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prueba: Luna</title>
<!--
  Banco de pruebas de la Luna (Proyecto Luna). Imágenes de generar-luna.py.
  Servir desde la raíz del repo:
    cd ~/Documents/zodk-web && python3 -m http.server 4400
  y abrir http://127.0.0.1:4400/logo-files/prototipo-luna/
-->
<style>
  html, body { margin: 0; height: 100%; background: #05060a url(../../public/zodk-estrellas.png);
    overflow: hidden; font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; color: #9fb3c8; }
  #luna { position: absolute; left: 50%; top: 50%; height: min(94vh, 94vw); aspect-ratio: 1;
    transform: translate(-50%, -50%); image-rendering: pixelated; }
  #luna.zoom { height: min(94vh, 94vw); }
  #panel { position: fixed; left: 12px; top: 12px; z-index: 5; background: #000a;
    padding: 8px 10px; border-radius: 6px; line-height: 2; }
  button { font: inherit; color: #05060a; background: #9fd3e6; border: 0; border-radius: 4px;
    padding: 3px 8px; cursor: pointer; }
  button.on { background: #fff; outline: 2px solid #9fd3e6; }
  #marcas { position: absolute; left: 50%; top: 50%; height: min(94vh, 94vw); aspect-ratio: 1;
    transform: translate(-50%, -50%); pointer-events: none; overflow: visible; }
  #marcas text { font: 11px ui-monospace, Menlo, monospace; fill: #ffd84a; paint-order: stroke;
    stroke: #000; stroke-width: 3px; }
</style>
</head>
<body>
<img id="luna" alt="">
<svg id="marcas" viewBox="0 0 600 600" hidden></svg>
<div id="panel">
  visible: <button data-f="luna-visible-derecha">A · por la derecha (aprobada)</button>
  <button data-f="luna-visible-derecha-penumbra-corta">A2 · derecha, penumbra corta</button>
  <button data-f="luna-visible">B · por la izquierda</button><br>
  visible, mares: <button data-f="luna-visible-derecha-valles">V1 · mares sin manchas</button>
  <button data-f="luna-visible-derecha-valles-rm2.5">V2 · V1 + relieve en los mares</button>
  <button data-f="luna-visible-derecha-valles-rm1.8">V2a · menos relieve</button>
  <button data-f="luna-visible-derecha-valles-rm2.5-sm2">V2b · mismo relieve, más suave</button><br>
  oculta: <button data-f="luna-oculta-f65">O1 · de frente, fase 65°</button>
  <button data-f="luna-oculta-sur-f65">O2 · inclinada al sur, fase 65°</button>
  <button data-f="luna-oculta-sur-f90">O3 · inclinada al sur, media luz (90°)</button><br>
  oculta oscura (con los mares de la V2): <button data-f="luna-oculta-sur-f65-valles-rm2.5">O2 · sin oscurecer</button>
  <button data-f="luna-oculta-sur-f65-valles-rm2.5-e0.7">D1 · luz 70 %</button>
  <button data-f="luna-oculta-sur-f65-valles-rm2.5-e0.5">D2 · luz 50 %</button>
  <button data-f="luna-oculta-sur-f65-valles-rm2.5-e0.6-frio0.5">D3 · luz 60 %, frío suave</button>
  <button data-f="luna-oculta-sur-f65-valles-rm2.5-e0.6-frio1">D4 · luz 60 %, frío</button><br>
  vista: <button data-z="0">disco entero</button> <button data-z="1">zoom x4 del centro (píxel real)</button>
  <button id="bm">marcas: Aitken y Chang'e (solo oculta)</button>
</div>
<script>
  const img = document.getElementById("luna");
  const svg = document.getElementById("marcas");
  let f = new URLSearchParams(location.search).get("f") || "luna-visible-derecha", z = "0", marcas = false;

  // Referencia para revisar la cara oculta (no es parte del dibujo): misma
  // proyección que generar-luna.py (LON0 180, LAT0 0 o -30 si es "-sur").
  const R = 292.5, C = 300, rad = Math.PI / 180;
  const proyecta = (lat, lon, lat0) => {
    const xx = Math.cos(lat * rad) * Math.sin((lon - 180) * rad);
    const yy = Math.sin(lat * rad), zz = Math.cos(lat * rad) * Math.cos((lon - 180) * rad);
    const c0 = Math.cos(lat0 * rad), s0 = Math.sin(lat0 * rad);
    return { x: C + xx * R, y: C - (yy * c0 - zz * s0) * R, vis: yy * s0 + zz * c0 > 0 };
  };
  const dibujaMarcas = () => {
    svg.hidden = !(marcas && f.startsWith("luna-oculta") && z === "0");
    if (svg.hidden) return;
    const lat0 = f.includes("-sur") ? -30 : 0;
    // cuenca Polo Sur-Aitken: centro ~53° S 191° E, ~2500 km de diámetro (radio ~41° de arco)
    const cl = -53 * rad, cn = 191 * rad, a = 41 * rad;
    let d = "", pen = false;
    for (let i = 0; i <= 180; i++) {
      const b = i * 2 * rad;
      const lat = Math.asin(Math.sin(cl) * Math.cos(a) + Math.cos(cl) * Math.sin(a) * Math.cos(b));
      const lon = cn + Math.atan2(Math.sin(b) * Math.sin(a) * Math.cos(cl), Math.cos(a) - Math.sin(cl) * Math.sin(lat));
      const p = proyecta(lat / rad, lon / rad, lat0);
      d += p.vis ? (pen ? "L" : "M") + p.x.toFixed(1) + " " + p.y.toFixed(1) : "";
      pen = p.vis;
    }
    const sitio = (nom, lat, lon) => {
      const p = proyecta(lat, lon, lat0);
      return p.vis ? `<circle cx="${p.x}" cy="${p.y}" r="4" fill="none" stroke="#ffd84a" stroke-width="2"/>` +
        `<text x="${p.x + 7}" y="${p.y + 4}">${nom}</text>` : "";
    };
    const ca = proyecta(-53, 191, lat0);
    svg.innerHTML = `<path d="${d}" fill="none" stroke="#ffd84a" stroke-width="1.5" stroke-dasharray="5 4"/>` +
      (ca.vis ? `<text x="${ca.x - 30}" y="${ca.y + 40}">Aitken</text>` : "") +
      sitio("Chang'e 4", -45.44, 177.59) + sitio("Chang'e 6", -41.64, 206.01);
  };
  const pinta = () => {
    img.src = f + (z === "1" && !/-e0|-frio/.test(f) ? "-zoom" : "") + ".png?" + Date.now();
    document.querySelectorAll("button").forEach(b =>
      b.classList.toggle("on", b.dataset.f === f || b.dataset.z === z || (b.id === "bm" && marcas)));
    dibujaMarcas();
  };
  document.querySelectorAll("button").forEach(b => b.onclick = () => {
    if (b.id === "bm") marcas = !marcas;
    else if (b.dataset.f) f = b.dataset.f; else z = b.dataset.z;
    pinta();
  });
  pinta();
</script>
</body>
</html>
