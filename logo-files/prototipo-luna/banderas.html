<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prueba: banderas de las chapas</title>
<!--
  Banco de pruebas SOLO para revisar el dibujo de cada bandera de país antes
  de ponerlas en chapas.html. Cada una: grande (para ver el detalle) y al
  tamaño real de chapa (13x9 px del lienzo de 600, como se vería en la Luna).
  Servir: cd ~/Documents/zodk-web && python3 -m http.server 4400
  Abrir:  http://127.0.0.1:4400/logo-files/prototipo-luna/banderas.html
-->
<style>
  html, body { margin: 0; background: #05060a; color: #dfe4ea;
    font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; padding: 24px; }
  h1 { font-size: 14px; color: #e6c078; letter-spacing: 0.08em; text-transform: uppercase;
    margin: 0 0 18px; }
  .fila { display: flex; align-items: center; gap: 22px; padding: 14px 0;
    border-bottom: 1px solid rgba(230, 192, 120, 0.15); }
  .fila.go { border-left: 3px solid #4caf6a; padding-left: 10px; }
  .nombre { width: 150px; flex: none; }
  .nombre b { display: block; color: #e6c078; font-size: 14px; }
  .nombre span { color: #8b93a0; font-size: 11px; }
  .grande svg { width: 220px; height: 140px; image-rendering: pixelated;
    background: #10131c; border: 1px solid #222a3a; }
  .real { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .real svg { width: 39px; height: 27px; image-rendering: pixelated;
    background: #2b2f38; }
  .real span { color: #8b93a0; font-size: 10px; }
  .nota { max-width: 320px; color: #8b93a0; font-size: 11.5px; line-height: 1.5; }
</style>
</head>
<body>
<h1>Banderas de chapa — revisión</h1>
<div id="lista"></div>
<script>
  // Mismo patrón que en chapas.html: filas de 11x7 + contorno oscuro de 1px
  // (13x9 en total, el tamaño real de una chapa en el lienzo de 600).
  const PAISES = {
    US: {
      nombre: "EE. UU.", bandera: "🇺🇸", nota: "Ya es la bandera real de la Tierra (BANDERAS \"US\" en generar-planeta-hero.py): no hace falta tocarla.",
      filas: ["BwBwBuuuuuu", "BBBBBwwwwww", "BwBwBuuuuuu", "BBBBBwwwwww",
              "uuuuuuuuuuu", "wwwwwwwwwww", "uuuuuuuuuuu"],
      paleta: { u: "#b82638", w: "#f4f4f0", B: "#333d74" },
    },
    RU: {
      nombre: "Rusia (URSS)", bandera: "🇷🇺", nota: "Tricolor horizontal blanco/azul/rojo a partes iguales (2/3/2 de 7 filas).",
      filas: ["wwwwwwwwwww", "wwwwwwwwwww", "zzzzzzzzzzz", "zzzzzzzzzzz",
              "zzzzzzzzzzz", "vvvvvvvvvvv", "vvvvvvvvvvv"],
      paleta: { w: "#f4f4f4", z: "#0039a6", v: "#d52b1e" },
    },
    CN: {
      nombre: "China", bandera: "🇨🇳", nota: "Campo rojo con una estrella grande (bloque 2x2) y cuatro pequeñas en arco a su derecha, todo compacto en la esquina superior izquierda (como el cantón real, no ocupa todo el alto).",
      filas: ["rrrrsrrrrrr", "rssrrsrrrrr", "rssrrrrrrrr", "rrrrrsrrrrr",
              "rrrrsrrrrrr", "rrrrrrrrrrr", "rrrrrrrrrrr"],
      paleta: { r: "#c8102e", s: "#f4c430" },
    },
    IN: {
      nombre: "India", bandera: "🇮🇳", nota: "Tricolor horizontal azafrán/blanco/verde a partes iguales, con el punto azul del Chakra en el centro.",
      filas: ["ooooooooooo", "ooooooooooo", "wwwwwCwwwww", "wwwwwCwwwww",
              "wwwwwwwwwww", "ggggggggggg", "ggggggggggg"],
      paleta: { o: "#ff9933", w: "#f4f4f4", g: "#138808", C: "#000080" },
    },
    JP: {
      nombre: "Japón", bandera: "🇯🇵", nota: "Campo blanco con el círculo rojo (Hinomaru) centrado.",
      filas: ["wwwwwwwwwww", "wwwwHHHwwww", "wwwHHHHHwww", "wwwHHHHHwww",
              "wwwHHHHHwww", "wwwwHHHwwww", "wwwwwwwwwww"],
      paleta: { w: "#f4f4f4", H: "#bc002d" },
    },
  };

  const svgBandera = (codigo, tam) => {
    const { filas, paleta } = PAISES[codigo];
    const fw = 11, fh = 7;
    let r = `<rect x="0" y="0" width="${fw + 2}" height="${fh + 2}" fill="#10131c"/>`;
    for (let y = 0; y < fh; y++)
      for (let x = 0; x < fw; x++)
        r += `<rect x="${x + 1}" y="${y + 1}" width="1" height="1" fill="${paleta[filas[y][x]]}"/>`;
    return `<svg viewBox="0 0 ${fw + 2} ${fh + 2}">${r}</svg>`;
  };

  const lista = document.getElementById("lista");
  for (const [codigo, p] of Object.entries(PAISES)) {
    const fila = document.createElement("div");
    fila.className = "fila" + (codigo === "US" ? " go" : "");
    fila.innerHTML = `
      <div class="nombre"><b>${p.bandera} ${p.nombre}</b><span>${codigo}</span></div>
      <div class="grande">${svgBandera(codigo)}</div>
      <div class="real">${svgBandera(codigo)}<span>tamaño real en la Luna</span></div>
      <div class="nota">${p.nota}</div>`;
    lista.appendChild(fila);
  }
</script>
</body>
</html>
