<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prueba: Marte</title>
<!--
  Banco de pruebas de Marte (Proyecto Marte). Imágenes de generar-marte.py.
  Servir desde la raíz del repo:
    cd ~/Documents/zodk-web && python3 -m http.server 4400
  y abrir http://127.0.0.1:4400/logo-files/prototipo-marte/
-->
<style>
  html, body { margin: 0; height: 100%; background: #05060a url(../../public/zodk-estrellas.png);
    overflow: hidden; font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; color: #9fb3c8; }
  /* El disco mide 60 svh: el PNG es de 450 px con un disco de 2 x 219,4, así
     que la imagen entera mide 60 x 450 / 438,8 svh. Mismo tamaño de píxel que
     la Luna de /luna (80 svh con radio 292,5). */
  #marte { position: absolute; left: 50%; top: 50%; height: calc(60svh * 450 / 438.8); aspect-ratio: 1;
    transform: translate(-50%, -50%); image-rendering: pixelated; }
  #marte.zoom { height: min(94vh, 94vw); }
  #panel { position: fixed; left: 12px; top: 12px; z-index: 5; background: #000a;
    padding: 8px 10px; border-radius: 6px; line-height: 2; }
  button { font: inherit; color: #05060a; background: #e6a978; border: 0; border-radius: 4px;
    padding: 3px 8px; cursor: pointer; }
  button.on { background: #fff; outline: 2px solid #e6a978; }
</style>
</head>
<body>
<img id="marte" alt="">
<div id="panel">
  cara: <button data-f="marte-tharsis">Tharsis y Valles Marineris</button>
  <button data-f="marte-syrtis">Syrtis Major, Gale y Hellas</button><br>
  vista: <button data-z="0">disco entero (60 svh)</button> <button data-z="1">zoom x4 del centro (píxel real)</button>
</div>
<script>
  const img = document.getElementById("marte");
  const q = new URLSearchParams(location.search);
  let f = q.get("f") || "marte-tharsis", z = q.get("z") || "0";
  const pinta = () => {
    img.src = `${f}${z === "1" ? "-zoom" : ""}.png?t=${Date.now()}`;
    img.classList.toggle("zoom", z === "1");
    document.querySelectorAll("[data-f]").forEach((b) => b.classList.toggle("on", b.dataset.f === f));
    document.querySelectorAll("[data-z]").forEach((b) => b.classList.toggle("on", b.dataset.z === z));
  };
  document.querySelectorAll("[data-f]").forEach((b) => b.addEventListener("click", () => { f = b.dataset.f; pinta(); }));
  document.querySelectorAll("[data-z]").forEach((b) => b.addEventListener("click", () => { z = b.dataset.z; pinta(); }));
  pinta();
</script>
</body>
</html>
