<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prueba: Marte con la mano</title>
<!--
  Banco de pruebas del giro con la mano (src/scripts/marte.js),
  con los datos de python3 logo-files/generar-marte.py --canvas public/marte/
  Servir desde la raíz del repo:
    cd ~/Documents/zodk-web && python3 -m http.server 4400
  y abrir http://127.0.0.1:4400/logo-files/prototipo-marte/canvas.html
  ?medir: al cargar, cuánto tarda un fotograma (para Zen, que no se puede
  manejar desde fuera).
-->
<style>
  html, body { margin: 0; height: 100%; overflow: hidden;
    font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; color: #9fb3c8; }
  #hero { position: fixed; inset: 0; overflow: hidden; background: #05060a url(../../public/zodk-estrellas.png); }
  /* el lienzo lo dimensiona marte.js (píxeles de arte enteros): aquí solo se centra */
  #marte { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); image-rendering: pixelated; }
  /* diámetro del disco: el mismo tamaño de píxel que la Luna de /luna */
  #sonda { position: absolute; height: 60svh; width: 0; visibility: hidden; }
  /* la mano (clases que pone montarMano) */
  .arrastrable { cursor: grab; }
  .agarrando, .agarrando * { cursor: grabbing !important; user-select: none; }
  #panel { position: fixed; left: 12px; top: 12px; z-index: 5; background: #000a;
    padding: 8px 10px; border-radius: 6px; line-height: 2; }
  button { font: inherit; color: #05060a; background: #e6a978; border: 0; border-radius: 4px;
    padding: 3px 8px; cursor: pointer; }
</style>
</head>
<body>
<div id="hero">
  <canvas id="marte"></canvas>
  <div id="sonda"></div>
  <div id="panel" data-sin-arrastre>
    Arrastra con el ratón para girar Marte.<br>
    ir a: <button data-v="10,-80">Tharsis</button> <button data-v="10,105">Syrtis</button>
    <button data-v="90,-80">polo norte</button> <button data-v="-90,-80">polo sur</button><br>
    <span id="vista"></span> · <span id="ms"></span>
  </div>
</div>
<script type="module">
import { montarMarte, montarMano } from "../../src/scripts/marte.js";

const $ = (id) => document.getElementById(id);
const sonda = $("sonda");
const cv = $("marte");
let ultimo = "";
const marte = await montarMarte(cv, {
  base: "../../public/marte/",
  disco: () => sonda.getBoundingClientRect().height,
  alPintar: (ms, limpio) => {
    ultimo = `${limpio ? "limpio" : "arrastrando"}: ${ms.toFixed(1)} ms`;
  },
});
montarMano($("hero"), marte);
window.marte = marte;                   // para probar desde la consola

const muestra = () => {
  const v = marte.vista();
  $("vista").textContent = `lat0 ${v.lat0.toFixed(0)}° · lon0 ${v.lon0.toFixed(0)}°`;
  $("ms").textContent = ultimo;
  requestAnimationFrame(muestra);
};
muestra();
document.querySelectorAll("[data-v]").forEach((b) => b.addEventListener("click", () => {
  const [la, lo] = b.dataset.v.split(",").map(Number);
  marte.ponVista(la, lo);
}));

if (new URLSearchParams(location.search).has("medir")) {
  const t = [];
  for (let i = 0; i < 8; i++) t.push(marte.medir());
  const u = t.slice(3);
  const f = (k) => u.map((x) => x[k].toFixed(1)).join(" · ");
  $("ms").textContent = `(${navigator.userAgent.includes("Firefox") ? "Firefox/Zen" : "Chrome"}: `
    + `inclinando ${f("conTablas")} ms; a los lados ${f("soloLon")} ms)`;
  ultimo = $("ms").textContent;
}
</script>
</body>
</html>
